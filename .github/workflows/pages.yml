name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify live database setup
        run: python3 tools/check-supabase.py
      - run: npm install --package-lock=false
      - name: Run regression tests
        run: |
          node --disable-warning=ExperimentalWarning tools/test-grading.cjs
          node --disable-warning=ExperimentalWarning tools/test-pwa.cjs
      - name: Build site
        env:
          VITE_BASE_PATH: /platform-practice-lab/
        run: |
          npm run build
          node tools/test-pages-build.cjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
