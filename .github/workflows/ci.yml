name: Lab CI

on:
  push:
    branches: [main, migration/free-hosting]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Check both grading implementations
        run: |
          node --disable-warning=ExperimentalWarning tools/test-backend.cjs
          node --disable-warning=ExperimentalWarning tools/test-grading.cjs
      - name: Check installable app behavior
        run: node --disable-warning=ExperimentalWarning tools/test-pwa.cjs
      - name: Type-check and build for GitHub Pages
        env:
          VITE_BASE_PATH: /platform-practice-lab/
        run: |
          npm run build
          node tools/test-pages-build.cjs

  database-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: lab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Test real PostgreSQL row-level security and save RPC
        env:
          PGPASSWORD: local-ci-only
        run: psql -h 127.0.0.1 -U postgres -d lab_test -v ON_ERROR_STOP=1 -f tools/test-rls.sql
